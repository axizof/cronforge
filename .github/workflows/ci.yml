name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build

  bundle-and-jsdoc:
    name: bundle-size + jsdoc + no-runtime-deps
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-no-runtime-deps.mjs
      - run: node scripts/check-bundle-size.mjs
      - run: node scripts/check-jsdoc-coverage.mjs
